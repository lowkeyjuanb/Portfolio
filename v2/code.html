<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio — Mara Vey, Developer & Creative Technologist</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23f1ede4%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2222%22 fill=%22%230a0a0a%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%229%22 fill=%22%23f1ede4%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1ede4;
    --ink:#0a0a0a;
    --ink-2:#1a1a1a;
    --mute:#7a7770;
    --line:#1a1a1a;
    --paper:#e8e3d6;
    --blue:#5b7a99;
    --cream:#f4f1ea;
    --warm:#e8c547;
    --soft:#d8d2c4;
    --ui-scale:1.49;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);}
  html{scroll-padding-top:68px}
  body{font-family:'Archivo',Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.02em}
  .nar{font-family:'Archivo Narrow',sans-serif;letter-spacing:.01em}
  .ser{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic}

  /* Stage shell that frames the viewport like the reference */
  #app{min-height:100vh;display:block;padding:0;background:var(--bg)}
  .device{
    background:var(--bg);
    border-radius:0;
    overflow:visible;
    box-shadow:none;
    position:relative;
    width:100%;
    margin:0 auto;
    min-height:100vh;
    transition:none;
  }
  .device.desktop{
    max-width:none;
    width:calc(100% / var(--ui-scale));
    zoom:var(--ui-scale);
  }
  .device.tablet{max-width:none}
  .device.mobile{max-width:none;border-radius:0}

  /* Re-usable layout */
  .pad{padding:0 36px}
  .device.tablet .pad{padding:0 28px}
  .device.mobile .pad{padding:0 20px}
  .row{display:flex}
  .col{display:flex;flex-direction:column}
  .between{justify-content:space-between}
  .center{align-items:center}

  /* Top bar */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;padding:22px 36px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    position:-webkit-sticky;position:sticky;top:0;z-index:1000;
    background:rgba(241,237,228,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(0,0,0,.08)
  }
  .device.mobile .topbar{padding:18px 20px}
  .topbar .logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:14px;letter-spacing:-.01em;text-transform:none;display:flex;align-items:center;gap:8px}
  .logo-mark{width:22px;height:22px;border-radius:50%;background:var(--ink);position:relative;overflow:hidden}
  .logo-mark::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
  .nav-pri{display:flex;gap:30px}
  .nav-pri a{position:relative}
  .nav-pri a .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:middle;opacity:.25}
  .nav-pri a.active .dot{opacity:1}
  .nav-end{display:flex;gap:18px;align-items:center}
  .icon-btn{width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
  .menu-pill{display:none;border:1px solid var(--ink);border-radius:999px;padding:8px 14px;font-size:11px;letter-spacing:.14em}
  .device.mobile .nav-pri,.device.tablet .nav-pri{display:none}
  .device.mobile .menu-pill,.device.tablet .menu-pill{display:inline-flex;align-items:center;gap:8px}

  /* Anchor offset for sticky top bar */
  #work,#services,#about,#stack,#contact{scroll-margin-top:68px}

  /* HERO */
  .hero{position:relative;padding:18px 36px 36px;min-height:760px}
  .device.tablet .hero{padding:18px 28px 28px;min-height:640px}
  .device.mobile .hero{padding:8px 20px 24px;min-height:auto}

  .hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-items:start}
  .device.tablet .hero-grid{grid-template-columns:1fr 1fr}
  .device.mobile .hero-grid{grid-template-columns:1fr}

  .hero-meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);display:flex;flex-direction:column;gap:6px}
  .hero-meta .lbl{color:var(--mute)}
  .hero-meta .row-i{display:flex;justify-content:space-between;border-top:1px solid var(--ink);padding-top:8px;margin-top:6px}

  .hero-stage{
    position:relative;grid-column:1/-1;
    height:520px;margin-top:14px;
    border-radius:18px;
    background:radial-gradient(120% 80% at 50% 40%, #fff 0%, #efe9da 60%, #d9d2c1 100%);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .device.tablet .hero-stage{height:380px}
  .device.mobile .hero-stage{height:360px;border-radius:14px;margin-top:8px}
  .hero-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hero-stage .corner{position:absolute;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
  .hero-stage .corner.tl{top:14px;left:16px}
  .hero-stage .corner.tr{top:14px;right:16px;text-align:right}
  .hero-stage .corner.bl{bottom:14px;left:16px}
  .hero-stage .corner.br{bottom:14px;right:16px;text-align:right}
  .hero-stage .num{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;color:var(--mute)}

  .hero-title{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:clamp(56px, 11vw, 168px);
    line-height:.86;
    letter-spacing:-.04em;
    text-transform:uppercase;
    margin:0;
  }
  .hero-title em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em;color:#1a1a1a}
  .device.tablet .hero-title{font-size:clamp(56px,12vw,108px)}
  .device.mobile .hero-title{font-size:clamp(44px,16vw,72px)}

  .hero-bottom{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;margin-top:28px;align-items:end}
  .device.tablet .hero-bottom{grid-template-columns:1fr 1fr}
  .device.mobile .hero-bottom{grid-template-columns:1fr;gap:16px}

  .lede{font-size:14px;line-height:1.5;color:#2a2a2a;max-width:36ch;text-wrap:pretty}
  .device.mobile .lede{font-size:13px}

  .ctas{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 18px;border-radius:999px;border:1px solid var(--ink);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .btn.dark{background:var(--ink);color:var(--bg)}
  .btn .arr{display:inline-block;transform:rotate(-45deg)}

  .hero-marquee{
    margin-top:24px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    padding:14px 0;display:flex;gap:48px;overflow:hidden;white-space:nowrap;font-size:13px;letter-spacing:.14em;text-transform:uppercase
  }
  .marq-track{display:flex;gap:48px;animation:marq 38s linear infinite;flex-shrink:0}
  .marq-track span{display:inline-flex;align-items:center;gap:48px}
  .marq-track .star{color:var(--blue)}
  @keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* Section header */
  .sec{padding:64px 36px;border-top:1px solid var(--ink)}
  .device.tablet .sec{padding:56px 28px}
  .device.mobile .sec{padding:44px 20px}
  .sec-head{display:grid;grid-template-columns:80px 1fr auto;gap:24px;align-items:end;margin-bottom:36px}
  .device.mobile .sec-head{grid-template-columns:60px 1fr;gap:16px}
  .sec-num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--mute)}
  .sec-title{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(36px,5.5vw,72px);letter-spacing:-.03em;line-height:.95;margin:0;text-transform:uppercase}
  .sec-title em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;text-transform:none}
  .device.mobile .sec-title{font-size:clamp(32px,9vw,44px)}
  .sec-meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:right}
  .device.mobile .sec-meta{display:none}

  /* WORK */
  .work-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  .device.tablet .work-grid{grid-template-columns:1fr 1fr}
  .device.mobile .work-grid{grid-template-columns:1fr;gap:14px}

  .card{
    border-radius:18px;overflow:hidden;background:#ece6d6;position:relative;
    border:1px solid rgba(0,0,0,.06);
    display:flex;flex-direction:column;min-height:380px;
  }
  .device.mobile .card{min-height:340px;border-radius:14px}
  .card .thumb{aspect-ratio:16/10;position:relative;overflow:hidden;background:#dcd6c5}
  .card.b .thumb{background:#0f0f0f}
  .card.c .thumb{background:#cdd4dc}
  .card .thumb canvas,.card .thumb svg{position:absolute;inset:0;width:100%;height:100%}
  .card .meta{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid rgba(0,0,0,.08);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#3a3a3a}
  .card .meta .tag{display:inline-block;padding:4px 8px;border:1px solid var(--ink);border-radius:999px;font-size:9px}
  .card .body{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
  .card h3{font-family:'Archivo',sans-serif;font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em;margin:0;text-transform:uppercase}
  .card.feat h3{font-size:44px}
  .device.mobile .card.feat h3{font-size:32px}
  .card p{margin:0;font-size:13px;line-height:1.5;color:#3a3a3a;max-width:46ch}
  .card .stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .card .stack span{font-family:'JetBrains Mono',monospace;font-size:10px;padding:5px 8px;border:1px solid rgba(0,0,0,.18);border-radius:999px;color:#222}
  .card .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(0,0,0,.08);padding:14px 18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .card .foot a{display:inline-flex;align-items:center;gap:8px}

  /* SERVICES */
  .services{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
  .srv{display:grid;grid-template-columns:80px 1.4fr 2fr 0.6fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--ink);align-items:center;cursor:pointer;transition:padding .25s ease,background .25s ease}
  .device.mobile .srv{grid-template-columns:50px 1fr;gap:6px;padding:18px 0}
  .srv:hover{padding:30px 0}
  .srv-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.2em}
  .srv-title{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(28px,3.4vw,44px);letter-spacing:-.02em;text-transform:uppercase;line-height:.95}
  .srv-title em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;text-transform:none}
  .srv-desc{font-size:13px;color:#3a3a3a;line-height:1.5;max-width:52ch}
  .device.mobile .srv-desc{grid-column:1/-1;font-size:13px;margin-top:6px}
  .srv-cta{justify-self:end;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
  .device.mobile .srv-cta{display:none}
  .device.mobile .srv-num{font-size:10px}

  /* ABOUT */
  .about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
  .device.tablet .about,.device.mobile .about{grid-template-columns:1fr;gap:24px}
  .about-lede{font-family:'Archivo',sans-serif;font-weight:600;font-size:clamp(22px,2.6vw,34px);line-height:1.15;letter-spacing:-.02em;text-wrap:pretty}
  .about-lede em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
  .about-side{display:flex;flex-direction:column;gap:18px;font-size:13px;line-height:1.55;color:#2a2a2a}
  .about-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .stat{padding:18px 0;border-right:1px solid var(--ink)}
  .stat:last-child{border-right:0;padding-left:18px}
  .stat .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1}
  .stat .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:6px}

  /* STACK */
  .stack-section{background:#0c0c0c;color:#f1ede4}
  .stack-section .sec-num,.stack-section .sec-meta{color:#9b988e}
  .stack-section .sec-title em{color:#cfc6ad}
  .stack-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
  .device.tablet .stack-grid{grid-template-columns:repeat(3,1fr)}
  .device.mobile .stack-grid{grid-template-columns:repeat(2,1fr)}
  .chip{background:#0c0c0c;padding:22px 18px;display:flex;flex-direction:column;gap:10px;min-height:140px;justify-content:space-between;position:relative;transition:background .25s ease}
  .chip:hover{background:#161616}
  .chip .nm{font-family:'Archivo',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
  .chip .yr{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#9b988e}
  .chip .cat{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9b988e}
  .chip .bar{height:2px;background:rgba(255,255,255,.15);overflow:hidden}
  .chip .bar i{display:block;height:100%;background:#cfc6ad}

  /* CONTACT */
  .contact{padding:96px 36px 60px;border-top:1px solid var(--ink);background:var(--bg)}
  .device.mobile .contact{padding:64px 20px 40px}
  .contact h2{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(56px,12vw,176px);letter-spacing:-.04em;line-height:.85;text-transform:uppercase;margin:0;text-wrap:balance}
  .contact h2 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;text-transform:none;color:var(--blue)}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:48px}
  .device.mobile .contact-grid{grid-template-columns:1fr;gap:18px;margin-top:32px}
  .contact-cell{border-top:1px solid var(--ink);padding-top:14px;font-size:12px;line-height:1.5}
  .contact-cell .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .contact-cell a{display:inline-flex;align-items:center;gap:8px}
  .contact-cell .big{font-family:'Archivo',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em}

  .footer{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;border-top:1px solid var(--ink);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#3a3a3a;flex-wrap:wrap;gap:12px}
  .device.mobile .footer{padding:20px;flex-direction:column;align-items:flex-start;gap:14px}

  /* Mobile menu sheet */
  .menu-sheet{position:absolute;inset:0;background:#0a0a0a;color:#f1ede4;z-index:30;padding:22px;display:flex;flex-direction:column;justify-content:space-between;transform:translateY(-100%);transition:transform .45s cubic-bezier(.7,.05,.2,1);pointer-events:none}
  .menu-sheet.open{transform:translateY(0);pointer-events:auto}
  .menu-sheet .top{display:flex;justify-content:space-between;align-items:center}
  .menu-sheet .links{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding:40px 0}
  .menu-sheet .links a{font-family:'Archivo',sans-serif;font-weight:800;font-size:42px;letter-spacing:-.02em;text-transform:uppercase;line-height:1;display:flex;flex-direction:column;align-items:center}
  .menu-sheet .links a .n{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:#9b988e;font-weight:400}
  .menu-sheet .foot{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9b988e;display:flex;justify-content:space-between}

  /* viewport selector visual */
  .vp-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.06);border-radius:999px;padding:4px}
  .vp-pill button{padding:6px 10px;border-radius:999px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .vp-pill button.active{background:#0a0a0a;color:#f1ede4}

  .device.mobile .hero-meta{flex-direction:row;justify-content:space-between;flex-wrap:wrap}

  /* tiny utilities */
  .hide-tablet{display:initial}
  .device.tablet .hide-tablet,.device.mobile .hide-tablet{display:none}
  .show-mobile{display:none}
  .device.mobile .show-mobile{display:initial}

  /* Star bullet */
  .star-svg{width:14px;height:14px;display:inline-block;vertical-align:middle}

  /* Bottom of contact sig */
  .sig{font-family:'Instrument Serif',serif;font-style:italic;font-size:32px;letter-spacing:-.01em;color:#0a0a0a}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="portfolio.jsx"></script>
</body>
</html>
